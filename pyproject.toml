[project]
name = "personal-authority-vault"
version = "0.1.0"
description = "Phase 0 authority lifecycle spike for Personal Authority Vault"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.7,<3",
]

[dependency-groups]
dev = [
    "pytest>=8.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pav"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
