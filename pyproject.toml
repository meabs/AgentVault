[project]
name = "personal-authority-vault"
version = "0.1.0"
description = "Phase 0 authority lifecycle spike for Personal Authority Vault"
requires-python = ">=3.12"
dependencies = [
    "cryptography>=43,<46",
    "fastapi>=0.115,<1",
    "mcp[cli]>=2,<3",
    "python-multipart>=0.0.9,<1",
    "pydantic>=2.7,<3",
    "uvicorn>=0.30,<1",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1",
    "pytest>=8.0,<9",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/pav"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
